name: Deploy to Cloudflare Workers (PNPM + Previews)

on:
  push:
    branches: [ main ]
  pull_request:            # preview deploys on PRs
  workflow_dispatch:
  repository_dispatch:
    types: [ fluxzero-sdk-updated ]

# Queue production refreshes; newer previews may still supersede older previews.
concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The current Cloudflare adapter selects its environment during the build.
      CLOUDFLARE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          fetch-depth: 0

      - name: Checkout SDK docs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fluxzero-io/fluxzero-sdk-java
          ref: ${{ github.event.client_payload.sdk_sha || github.event.client_payload.after || github.event.client_payload.sha || 'main' }}
          path: .cache/fluxzero-sdk-java
          fetch-depth: 0
          persist-credentials: false

      - name: Test SDK docs change detection
        run: python3 .github/scripts/sdk-docs-changed.test.py

      - name: Detect SDK documentation or release changes
        id: sdk-docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          SDK_BEFORE: ${{ github.event.client_payload.sdk_before || github.event.client_payload.before }}
          SDK_AFTER: ${{ github.event.client_payload.sdk_sha || github.event.client_payload.after || github.event.client_payload.sha || 'HEAD' }}
          SDK_VERSION: ${{ github.event.client_payload.sdk_version }}
        run: |
          if [ "$EVENT_NAME" != "repository_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            bash .github/scripts/sdk-docs-changed.sh .cache/fluxzero-sdk-java "$SDK_BEFORE" "$SDK_AFTER" "$SDK_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PNPM
        if: steps.sdk-docs.outputs.changed == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        if: steps.sdk-docs.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install deps (frozen lockfile)
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test Javadoc previews
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm test:javadoc

      - name: Test changelog import
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm test:changelog

      - name: Test marketing text export
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm test:llms

      - name: Test discoverability checks
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm test:discovery

      - name: Test SEO and stylesheet protections
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm test:seo

      - name: Test diagram dependency compatibility
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm test:diagram-deps

      - name: Test website OIDC
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm test:website-oidc

      - name: Test capacity pricing
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm test:pricing && pnpm test:pricing-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLUXZERO_SDK_DOCS_SOURCE: .cache/fluxzero-sdk-java/docs/developer

      - name: Setup Java for product examples
        if: steps.sdk-docs.outputs.changed == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: tests/product-code/pom.xml

      - name: Test product code examples
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm test:product-code

      - name: Build
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLUXZERO_SDK_DOCS_SOURCE: .cache/fluxzero-sdk-java/docs/developer
          PRICING_CATALOG_URL: ${{ vars.PRICING_CATALOG_URL }}
          PUBLIC_WEBSITE_OIDC_ENABLED: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          PUBLIC_WEBSITE_OIDC_ISSUER: https://login.fluxzero.io
          PUBLIC_WEBSITE_OIDC_CLIENT_ID: fluxzero-website
          PUBLIC_WEBSITE_OIDC_SITE_ORIGIN: https://fluxzero.io

      - name: Test the built Worker runtime
        if: steps.sdk-docs.outputs.changed == 'true'
        run: pnpm test:worker

      - name: Read the qualified Wrangler version
        if: steps.sdk-docs.outputs.changed == 'true'
        id: tooling
        run: echo "wrangler=$(node -p 'require("./node_modules/wrangler/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        # Bot and fork PRs qualify the same build without any deployment secrets.
        if: >-
          steps.sdk-docs.outputs.changed == 'true' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          wranglerVersion: ${{ steps.tooling.outputs.wrangler }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # If account_id isn't in wrangler.toml, uncomment:
          # accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            GITHUB_APP_CLIENT_ID
            GITHUB_APP_CLIENT_SECRET
            COOKIE_SECRET
            GITHUB_TOKEN
        env:
          GITHUB_APP_CLIENT_ID: ${{ secrets.CF_GITHUB_APP_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.CF_GITHUB_APP_CLIENT_SECRET }}
          COOKIE_SECRET: ${{ secrets.CF_COOKIE_SECRET }}
          GITHUB_TOKEN: ${{ secrets.CF_GITHUB_TOKEN }}

      - name: Notify IndexNow after production deployment
        if: steps.sdk-docs.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        run: node scripts/submit-indexnow.mjs

  gate:
    name: Website required checks
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Require the full website and product-code qualification
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
